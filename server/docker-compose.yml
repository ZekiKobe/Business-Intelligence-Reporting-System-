services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bi_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://postgres:postgres@db:5432/bi_app
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python server/manage.py run_due_schedules
    environment:
      DEBUG: "true"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://postgres:postgres@db:5432/bi_app
    depends_on:
      - db

volumes:
  pgdata:
